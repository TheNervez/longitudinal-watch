// ── CALENDAR ENGINE ──
function getBlocksForDate(d){
  const ds=dayStart(d),de=new Date(ds.getTime()+86400000);
  return expandBlocks(ds,de);
}

function expandBlocks(rangeStart,rangeEnd){
  const result=[];
  for(const b of projBlocks){
    const bStart=new Date(b.start_dt),bEnd=new Date(b.end_dt);
    const dur=bEnd-bStart;
    const until=b.recur_until?new Date(b.recur_until+'T23:59:59'):rangeEnd;
    if(b.recurrence==='none'||!b.recurrence){
      if(bStart<rangeEnd&&bEnd>rangeStart)result.push({...b,_start:bStart,_end:bEnd});
    }else{
      let cur=new Date(bStart);
      while(cur<rangeEnd&&cur<=until){
        const oEnd=new Date(cur.getTime()+dur);
        if(cur<rangeEnd&&oEnd>rangeStart)result.push({...b,_start:new Date(cur),_end:oEnd});
        if(b.recurrence==='daily')cur=new Date(cur.getTime()+86400000);
        else if(b.recurrence==='weekly')cur=new Date(cur.getTime()+7*86400000);
        else if(b.recurrence==='monthly')cur=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate(),cur.getHours(),cur.getMinutes());
        else break;
      }
    }
  }
  return result;
}

function blocksOnDay(d,expanded){
  const ds=dayStart(d),de=new Date(ds.getTime()+86400000);
  return expanded.filter(b=>b._start<de&&b._end>ds);
}

function setCalView(v){calView=v;['month','week','day'].forEach(x=>document.getElementById('cv-'+x)?.classList.toggle('on',x===v));renderCal();}
function calNav(dir){
  if(calView==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+dir,1);
  else if(calView==='week')calDate=new Date(calDate.getTime()+dir*7*86400000);
  else calDate=new Date(calDate.getTime()+dir*86400000);
  renderCal();
}
function goToday(){calDate=new Date();renderCal();}

function renderCal(){
  const title=document.getElementById('cal-title');
  const body=document.getElementById('cal-body');
  if(calView==='month'){
    title.textContent=MONTHS[calDate.getMonth()]+' '+calDate.getFullYear();
    body.innerHTML='';body.appendChild(buildMonth());
  }else if(calView==='week'){
    const ws=weekStart(calDate);
    const we=new Date(ws.getTime()+6*86400000);
    title.textContent=fmtShortDate(ws)+' — '+fmtShortDate(we);
    body.innerHTML='';body.appendChild(buildWeek(ws));
  }else{
    title.textContent=DAYS[calDate.getDay()]+', '+MONTHS[calDate.getMonth()]+' '+calDate.getDate();
    body.innerHTML='';body.appendChild(buildDay(calDate));
  }
}

function buildMonth(){
  const now=new Date();
  const firstDay=new Date(calDate.getFullYear(),calDate.getMonth(),1);
  const lastDay=new Date(calDate.getFullYear(),calDate.getMonth()+1,0);
  const startPad=firstDay.getDay();
  const rangeStart=new Date(firstDay.getTime()-startPad*86400000);
  const rangeEnd=new Date(lastDay.getTime()+(6-lastDay.getDay())*86400000+86400000);
  const expanded=expandBlocks(rangeStart,rangeEnd);

  const wrap=document.createElement('div');wrap.className='cal-month';
  const dowRow=document.createElement('div');dowRow.className='cal-dow-header';
  DAYS.forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;dowRow.appendChild(el);});
  wrap.appendChild(dowRow);

  const grid=document.createElement('div');grid.className='cal-grid';
  let cur=new Date(rangeStart);
  while(cur<rangeEnd){
    const cell=document.createElement('div');
    const isThisMonth=cur.getMonth()===calDate.getMonth();
    const isToday=sameDay(cur,now);
    cell.className='cal-cell'+(isThisMonth?'':' other-month')+(isToday?' today':'');

    const dayBlocks=blocksOnDay(cur,expanded);

    // Project background — one colored strip per project, split horizontally
    if(dayBlocks.length===1){
      const p=projects.find(x=>x.id===dayBlocks[0].project_id);
      const col=PROJ_COLORS[p?.color||'g'];
      const bg=document.createElement('div');
      bg.className='proj-bg-zone';bg.style.background=col;
      cell.appendChild(bg);
    }else if(dayBlocks.length>1){
      // Deduplicate by project
      const seen=new Set();
      const uniqueProjs=dayBlocks.filter(b=>{if(seen.has(b.project_id))return false;seen.add(b.project_id);return true;});
      const w=100/uniqueProjs.length;
      uniqueProjs.forEach((b,i)=>{
        const p=projects.find(x=>x.id===b.project_id);
        const col=PROJ_COLORS[p?.color||'g'];
        const strip=document.createElement('div');
        strip.style.cssText=`position:absolute;top:0;bottom:0;left:${i*w}%;width:${w}%;background:${col};opacity:0.15;pointer-events:none;z-index:0;`;
        cell.appendChild(strip);
      });
    }

    // Day number
    const dNum=document.createElement('div');dNum.className='cal-day-num';dNum.textContent=cur.getDate();
    cell.appendChild(dNum);

    // Group boxes (from daily plan)
    const cellDate=new Date(cur);
    dayBlocks.slice(0,2).forEach(b=>{
      const plan=getPlanForDate(b.id,cellDate);
      const p=projects.find(x=>x.id===b.project_id);
      const col=PROJ_COLORS[p?.color||'g'];
      if(plan&&plan.group_ids?.length){
        plan.group_ids.slice(0,2).forEach(gid=>{
          const g=groups.find(x=>x.id===gid);if(!g)return;
          const box=document.createElement('div');
          box.className='grp-box';
          box.style.borderColor=col+'66';
          box.textContent=g.name;
          box.onclick=(e)=>{e.stopPropagation();openProjModal(b.id);};
          cell.appendChild(box);
        });
        const remaining=(plan.group_ids.length-2);
        if(remaining>0){const m=document.createElement('div');m.className='cal-more';m.textContent='+'+remaining+' groups';cell.appendChild(m);}
      }else{
        // No groups planned — show project name faintly
        const lbl=document.createElement('div');
        lbl.className='proj-label-chip';lbl.style.color=col;lbl.textContent=p?.name||'';
        cell.appendChild(lbl);
      }
    });

    cell.onclick=()=>openProjModal(null);
    if(dayBlocks.length)cell.onclick=(e)=>{if(e.target===cell||e.target===dNum)openPlanModal();};
    grid.appendChild(cell);
    cur=new Date(cur.getTime()+86400000);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildWeek(wStart){
  const now=new Date();
  const wEnd=new Date(wStart.getTime()+7*86400000);
  const expanded=expandBlocks(wStart,wEnd);

  const wrap=document.createElement('div');wrap.className='cal-timed';

  // Column headers
  const header=document.createElement('div');header.className='week-col-header';
  const gt=document.createElement('div');gt.className='week-gutter-top';header.appendChild(gt);
  for(let i=0;i<7;i++){
    const d=new Date(wStart.getTime()+i*86400000);
    const isToday=sameDay(d,now);
    const col=document.createElement('div');col.className='week-day-col-head';col.style.flex='1';
    col.innerHTML=`<div class="wdh-dow">${DAYS[d.getDay()]}</div><div class="wdh-date${isToday?' today':''}">${d.getDate()}</div>`;
    col.onclick=()=>{calDate=new Date(d);setCalView('day');};
    header.appendChild(col);
  }
  wrap.appendChild(header);

  const body=document.createElement('div');body.className='timed-body';
  const totalH=24*HOUR_H;

  // Time gutter
  const gutter=document.createElement('div');gutter.className='time-gutter';gutter.style.height=totalH+'px';
  for(let h=1;h<24;h++){const lbl=document.createElement('div');lbl.className='time-lbl';lbl.style.top=(h*HOUR_H)+'px';lbl.textContent=h===12?'12 PM':h<12?h+' AM':(h-12)+' PM';gutter.appendChild(lbl);}
  body.appendChild(gutter);

  const dayColsWrap=document.createElement('div');dayColsWrap.className='day-cols';

  for(let i=0;i<7;i++){
    const d=new Date(wStart.getTime()+i*86400000);
    const col=document.createElement('div');col.className='day-col-wrap';col.style.height=totalH+'px';

    // Hour lines
    for(let h=0;h<24;h++){const line=document.createElement('div');line.className='hour-line';line.style.top=(h*HOUR_H)+'px';col.appendChild(line);}

    // Project background blocks + group boxes - handle multiple projects side by side
    const dayBlocks=blocksOnDay(d,expanded);
    // Deduplicate blocks by project for background rendering
    const seenP=new Set();
    const uniqueProjBlocks=dayBlocks.filter(b=>{const k=b.project_id+'_'+b._start.getTime();if(seenP.has(k))return false;seenP.add(k);return true;});
    const nCols=uniqueProjBlocks.length||1;
    uniqueProjBlocks.forEach((b,bi)=>{
      const p=projects.find(x=>x.id===b.project_id);
      const col2=PROJ_COLORS[p?.color||'g'];
      const startMin=b._start.getHours()*60+b._start.getMinutes();
      const endMin=b._end.getHours()*60+b._end.getMinutes();
      const top=startMin/60*HOUR_H;
      const height=Math.max((endMin-startMin)/60*HOUR_H,20);
      const colW=100/nCols;
      const colL=bi*colW;

      // Background tint strip
      const bg=document.createElement('div');
      bg.className='proj-bg-block';
      bg.style.cssText=`top:${top}px;height:${height}px;left:${colL}%;width:${colW}%;background:${col2};`;
      bg.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
      col.appendChild(bg);

      // Group boxes or project label
      const plan=getPlanForDate(b.id,d);
      if(plan&&plan.group_ids?.length){
        const perH=height/plan.group_ids.length;
        plan.group_ids.forEach((gid,idx)=>{
          const g=groups.find(x=>x.id===gid);if(!g)return;
          const box=document.createElement('div');
          box.className='grp-time-box';
          box.style.cssText=`top:${top+idx*perH+2}px;height:${Math.max(perH-4,18)}px;left:calc(${colL}% + 3px);right:calc(${100-colL-colW}% + 3px);`;
          box.innerHTML=`<div class="grp-time-title">${esc(g.name)}</div><div class="grp-time-sub">${esc(p?.name||'')}</div>`;
          box.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
          col.appendChild(box);
        });
      }else{
        const lbl=document.createElement('div');
        lbl.className='no-grp-label';
        lbl.style.cssText=`top:${top+4}px;left:calc(${colL}% + 4px);right:calc(${100-colL-colW}% + 4px);`;
        lbl.innerHTML=`<span style="color:${col2}cc;">${esc(p?.name||'')}</span> <span style="opacity:0.4;">· tap to plan</span>`;
        lbl.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
        col.appendChild(lbl);
      }
    });

    // Now line
    if(sameDay(d,now)){
      const line=document.createElement('div');line.className='now-line';
      const mins=now.getHours()*60+now.getMinutes();line.style.top=(mins/60*HOUR_H)+'px';
      const dot=document.createElement('div');dot.className='now-dot';line.appendChild(dot);col.appendChild(line);
    }

    dayColsWrap.appendChild(col);
  }
  body.appendChild(dayColsWrap);
  wrap.appendChild(body);
  setTimeout(()=>{body.scrollTop=7*HOUR_H;},50);
  return wrap;
}

function buildDay(d){
  const now=new Date();
  const expanded=expandBlocks(dayStart(d),new Date(dayStart(d).getTime()+86400000));
  const dayBlocks=blocksOnDay(d,expanded);

  const wrap=document.createElement('div');wrap.className='cal-timed';

  const head=document.createElement('div');
  head.style.cssText='padding:1rem 1.25rem;border-bottom:0.5px solid var(--border);flex-shrink:0;';
  head.innerHTML=`<div style="font-family:var(--serif);font-size:1.4rem;color:var(--dew);">${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}</div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;">${d.getFullYear()}${dayBlocks.length?' · '+dayBlocks.length+' project slot'+(dayBlocks.length>1?'s':''):''}</div>`;
  wrap.appendChild(head);

  const body=document.createElement('div');body.className='timed-body';
  const totalH=24*HOUR_H;

  const gutter=document.createElement('div');gutter.className='time-gutter';gutter.style.height=totalH+'px';
  for(let h=1;h<24;h++){const lbl=document.createElement('div');lbl.className='time-lbl';lbl.style.top=(h*HOUR_H)+'px';lbl.textContent=h===12?'12 PM':h<12?h+' AM':(h-12)+' PM';gutter.appendChild(lbl);}
  body.appendChild(gutter);

  const col=document.createElement('div');
  col.style.cssText='flex:1;border-left:0.5px solid var(--border);position:relative;height:'+totalH+'px;';
  for(let h=0;h<24;h++){const line=document.createElement('div');line.className='hour-line';line.style.top=(h*HOUR_H)+'px';col.appendChild(line);}

  dayBlocks.forEach(b=>{
    const p=projects.find(x=>x.id===b.project_id);
    const col2=PROJ_COLORS[p?.color||'g'];
    const startMin=b._start.getHours()*60+b._start.getMinutes();
    const endMin=b._end.getHours()*60+b._end.getMinutes();
    const top=startMin/60*HOUR_H;
    const height=Math.max((endMin-startMin)/60*HOUR_H,24);

    const bg=document.createElement('div');
    bg.className='proj-bg-block';
    bg.style.cssText=`top:${top}px;height:${height}px;background:${col2};left:0;right:0;`;
    bg.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
    col.appendChild(bg);

    const plan=getPlanForDate(b.id,d);
    if(plan&&plan.group_ids?.length){
      const perH=height/plan.group_ids.length;
      plan.group_ids.forEach((gid,idx)=>{
        const g=groups.find(x=>x.id===gid);if(!g)return;
        const box=document.createElement('div');
        box.className='grp-time-box';
        box.style.cssText=`top:${top+idx*perH+2}px;height:${Math.max(perH-4,22)}px;left:6px;right:6px;`;
        box.innerHTML=`<div class="grp-time-title" style="font-size:13px;">${esc(g.name)}</div><div class="grp-time-sub">${fmtTime(b._start)}–${fmtTime(b._end)} · ${esc(p?.name||'')}</div>`;
        box.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
        col.appendChild(box);
      });
    }else{
      const lbl=document.createElement('div');
      lbl.className='no-grp-label';lbl.style.cssText=`top:${top+4}px;left:6px;right:6px;font-size:11px;`;
      lbl.innerHTML=`<span style="color:${col2}cc;">${esc(p?.name||'')}</span> <span style="opacity:0.4;">· tap to plan groups</span>`;
      lbl.onclick=(e)=>{e.stopPropagation();openPlanModal(b.id);};
      col.appendChild(lbl);
    }
  });

  if(sameDay(d,now)){
    const line=document.createElement('div');line.className='now-line';
    const mins=now.getHours()*60+now.getMinutes();line.style.top=(mins/60*HOUR_H)+'px';
    const dot=document.createElement('div');dot.className='now-dot';line.appendChild(dot);col.appendChild(line);
  }

  body.appendChild(col);wrap.appendChild(body);
  setTimeout(()=>{body.scrollTop=7*HOUR_H;},50);
  return wrap;
}

// DATE UTILS
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function weekStart(d){const day=d.getDay();return new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);}
function toDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toTimeStr(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtShortDate(d){return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate();}
function fmtTime(d){const h=d.getHours(),m=d.getMinutes();return(h===0?12:h>12?h-12:h)+':'+(m<10?'0':'')+m+(h<12?'am':'pm');}

// UTILS
function fmtMs(ms){
  if(!ms||ms<0)ms=0;const s=Math.floor(ms/1000);
  return`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}


// ── GOOGLE CALENDAR INTEGRATION ──
const GCAL_CLIENT_ID='877075923113-ksd32o5q4o5dosk2g0inqt1n50u9kip1.apps.googleusercontent.com';
const GCAL_SCOPES='https://www.googleapis.com/auth/calendar';
const GCAL_CAL_NAME='Longitudinal Watch';
const GCAL_API='https://www.googleapis.com/calendar/v3';
let gcalToken=null;
let gcalCalendarId=null;
let gcalTokenClient=null;
let gcalPendingAction=null;

// Initialize Google Identity Services after page load
window.addEventListener('load',()=>{
  // Wait for GSI script to load
  const waitForGSI=setInterval(()=>{
    if(window.google?.accounts?.oauth2){
      clearInterval(waitForGSI);
      gcalTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:GCAL_CLIENT_ID,
        scope:GCAL_SCOPES,
        callback:async(resp)=>{
          if(resp.error){toast('Calendar auth failed: '+resp.error);return;}
          gcalToken=resp.access_token;
          updateGCalBtn(true);
          await ensureGCalCalendar();
          if(gcalPendingAction){await gcalPendingAction();gcalPendingAction=null;}
          else{await syncAllBlocks();toast('Google Calendar connected and synced');}
        }
      });
      // Try to restore token from sessionStorage
      const saved=sessionStorage.getItem('lw_gcal_token');
      if(saved){
        gcalToken=saved;
        updateGCalBtn(true);
        ensureGCalCalendar();
      }
    }
  },200);
});

function updateGCalBtn(connected){
  const btn=document.getElementById('gcal-btn');
  const txt=document.getElementById('gcal-btn-text');
  if(!btn)return;
  if(connected){btn.classList.add('connected');txt.textContent='Calendar synced';}
  else{btn.classList.remove('connected');txt.textContent='Connect Calendar';}
}

async function handleGCalBtn(){
  if(gcalToken){
    if(confirm('Disconnect Google Calendar?')){
      gcalToken=null;gcalCalendarId=null;
      sessionStorage.removeItem('lw_gcal_token');
      updateGCalBtn(false);
      toast('Google Calendar disconnected');
    }
    return;
  }
  if(!gcalTokenClient){toast('Google auth not ready yet, try again in a moment');return;}
  gcalTokenClient.requestAccessToken({prompt:'consent'});
}

// Save token to session so it survives page refreshes within the same session
function saveGCalToken(token){
  gcalToken=token;
  sessionStorage.setItem('lw_gcal_token',token);
}

async function gcalFetch(path,options={}){
  if(!gcalToken)return null;
  const url=path.startsWith('http')?path:GCAL_API+path;
  const res=await fetch(url,{
    ...options,
    headers:{'Authorization':'Bearer '+gcalToken,'Content-Type':'application/json',...(options.headers||{})}
  });
  if(res.status===401){
    // Token expired — clear and prompt re-auth
    gcalToken=null;sessionStorage.removeItem('lw_gcal_token');updateGCalBtn(false);
    toast('Calendar session expired — reconnect to sync');
    return null;
  }
  if(res.status===204||res.status===200&&res.headers.get('content-length')==='0')return{};
  return res.json().catch(()=>({}));
}

async function ensureGCalCalendar(){
  if(!gcalToken)return;
  try{
    const data=await gcalFetch('/users/me/calendarList');
    if(!data)return;
    const existing=data.items?.find(c=>c.summary===GCAL_CAL_NAME);
    if(existing){gcalCalendarId=existing.id;return;}
    const created=await gcalFetch('/calendars',{method:'POST',body:JSON.stringify({summary:GCAL_CAL_NAME,description:'Project blocks from Longitudinal Watch',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone})});
    if(!created)return;
    gcalCalendarId=created.id;
    // Color it green
    await gcalFetch('/users/me/calendarList/'+encodeURIComponent(gcalCalendarId),{method:'PATCH',body:JSON.stringify({backgroundColor:'#0f9d58',foregroundColor:'#ffffff'})});
  }catch(e){console.error('ensureGCalCalendar',e);}
}

async function syncAllBlocks(){
  if(!gcalToken||!gcalCalendarId)return;
  for(const b of projBlocks)await syncBlockToGCal(b);
}

async function syncBlockToGCal(block){
  if(!gcalToken||!gcalCalendarId)return;
  const p=projects.find(x=>x.id===block.project_id);if(!p)return;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  let recurrence=[];
  if(block.recurrence&&block.recurrence!=='none'){
    let rrule='RRULE:FREQ=';
    if(block.recurrence==='daily')rrule+='DAILY';
    else if(block.recurrence==='weekly')rrule+='WEEKLY';
    else if(block.recurrence==='monthly')rrule+='MONTHLY';
    if(block.recur_until)rrule+=';UNTIL='+block.recur_until.replace(/-/g,'')+'T235959Z';
    recurrence=[rrule];
  }
  const resource={
    summary:p.name,
    description:'Created by Longitudinal Watch',
    start:{dateTime:new Date(block.start_dt).toISOString(),timeZone:tz},
    end:{dateTime:new Date(block.end_dt).toISOString(),timeZone:tz},
    recurrence,
    extendedProperties:{private:{lwBlockId:block.id}}
  };
  if(block.gcal_event_id){
    // Try update first
    const upd=await gcalFetch('/calendars/'+encodeURIComponent(gcalCalendarId)+'/events/'+block.gcal_event_id,{method:'PUT',body:JSON.stringify(resource)});
    if(upd)return;
  }
  // Create
  const created=await gcalFetch('/calendars/'+encodeURIComponent(gcalCalendarId)+'/events',{method:'POST',body:JSON.stringify(resource)});
  if(created?.id){
    await sb.from('lw_proj_blocks').update({gcal_event_id:created.id}).eq('id',block.id);
    block.gcal_event_id=created.id;
  }
}

function buildGroupDesc(blockId,dateStr){
  const plan=dailyPlans.find(dp=>dp.block_id===blockId&&dp.plan_date===dateStr);
  if(!plan||!plan.group_ids?.length)return'Created by Longitudinal Watch';
  const names=plan.group_ids.map(gid=>groups.find(g=>g.id===gid)?.name).filter(Boolean);
  return'Created by Longitudinal Watch\n\nFocus groups: '+names.join(', ');
}

async function updateGCalOccurrence(blockId,dateStr){
  if(!gcalToken||!gcalCalendarId)return;
  const block=projBlocks.find(b=>b.id===blockId);if(!block?.gcal_event_id)return;
  const desc=buildGroupDesc(blockId,dateStr);
  const startDt=new Date(block.start_dt);
  const occDate=new Date(dateStr);
  const occStart=new Date(occDate.getFullYear(),occDate.getMonth(),occDate.getDate(),startDt.getHours(),startDt.getMinutes());
  const occEnd=new Date(occStart.getTime()+(new Date(block.end_dt)-startDt));
  try{
    if(block.recurrence&&block.recurrence!=='none'){
      // Find specific instance
      const url=GCAL_API+'/calendars/'+encodeURIComponent(gcalCalendarId)+'/events/'+block.gcal_event_id+'/instances?timeMin='+occStart.toISOString()+'&timeMax='+new Date(occStart.getTime()+86400000).toISOString()+'&maxResults=1';
      const instances=await gcalFetch(url);
      const inst=instances?.items?.[0];
      if(inst){
        await gcalFetch('/calendars/'+encodeURIComponent(gcalCalendarId)+'/events/'+inst.id,{method:'PATCH',body:JSON.stringify({description:desc})});
      }
    }else{
      await gcalFetch('/calendars/'+encodeURIComponent(gcalCalendarId)+'/events/'+block.gcal_event_id,{method:'PATCH',body:JSON.stringify({description:desc})});
    }
  }catch(e){console.error('updateGCalOccurrence',e);}
}

async function deleteGCalEvent(block){
  if(!gcalToken||!gcalCalendarId||!block?.gcal_event_id)return;
  await gcalFetch('/calendars/'+encodeURIComponent(gcalCalendarId)+'/events/'+block.gcal_event_id,{method:'DELETE'});
}

init();
</script>
